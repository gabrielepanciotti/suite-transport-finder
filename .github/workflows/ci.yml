name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFE_FRAMEWORK_REPO || 'suite-life' }}
          path: Life
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt ../../Life/packages/shared ../../Life/packages/backend-core
        working-directory: repo/backend
      - name: Run backend tests
        run: pytest -q
        working-directory: repo/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFE_FRAMEWORK_REPO || 'suite-life' }}
          path: Life
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: repo/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: repo/frontend
      - name: Run frontend tests
        run: npm test -- --pool=forks --poolOptions.forks.maxForks=2
        working-directory: repo/frontend
      - name: Build frontend
        run: npm run build
        working-directory: repo/frontend
